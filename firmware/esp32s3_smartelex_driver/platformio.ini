; ==============================================================================
; PLATFORMIO PROJECT CONFIGURATION FOR NAMMY ROBOT ESP32-S3 MOTOR CONTROLLER
; Board: ESP32-S3-DevKitC-1 (Xtensa Dual-Core 240MHz, 8MB Flash)
; ==============================================================================

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=0
